name: Scheduled Ping on Todo 4

on:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Todo app 5
        uses: srt32/uptime@v0.2
        with:
            url-to-hit: "https://curious-paprenjak-5fc788.netlify.app"
            expected-statuses: "200,301"
