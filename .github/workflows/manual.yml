name: Scheduled Ping on Todo 4

on:
  schedule:
    - cron: '* * * * *'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Todo app
        uses: srt32/uptime@v0.2
        with:
          expected-statuses: 200
        env:
          URL: https://curious-paprenjak-5fc788.netlify.app
          METHOD: GET
