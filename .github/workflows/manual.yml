name: Scheduled Ping on Todo
# This workflow is triggered at a scheduled interval of every 30 minutes
on:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  ping_site:
    runs-on: ubuntu-latest
    name: Ping the site
    steps:
    - name: Check the site
      id: hello
      uses: srt32/uptime@master
      with:
        url-to-hit: "https://todo-app-vemn.onrender.com"
        expected-statuses: "200,301"
